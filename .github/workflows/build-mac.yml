name: Build Mac Game

on:
  workflow_dispatch: # 수동 실행 버튼 생성

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 저장소의 코드를 가져옵니다
        uses: actions/checkout@v4

      - name: 파이썬 세팅 (3.11 버전)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 빌드 도구 설치
        run: |
          pip install pyinstaller

      - name: 맥용 실행 파일 생성
        run: |
          #TextGame 은 프로그램 이름
          pyinstaller --onefile --name "TextGame" main.py

      - name: 완성된 파일을 결과물로 저장
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Executable
          path: dist/TextGame
